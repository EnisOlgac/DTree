name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Tree.View is a WPF app (net9.0-windows), so the solution builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build
        run: dotnet build csharp/DTree.sln --configuration Release -p:Platform=x64

  csharp:
    # C# port of the Python implementation (csharp/DTree.Core) with its test program.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Test
        run: dotnet run --project csharp/DTree.Tests -c Release

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install triordinal-dtree
        run: python -m pip install "triordinal-dtree>=2.0.0"
      - name: Test
        working-directory: python
        run: python -m unittest discover -s tests -v
