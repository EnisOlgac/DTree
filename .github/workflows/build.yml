name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Tree.View is a WPF app (net9.0-windows), so the solution builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build
        run: dotnet build src/DTree.sln --configuration Release -p:Platform=x64

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        working-directory: python
        run: python -m unittest discover -s tests -v
