name: publish

# Runs when a GitHub release is published (gh release create vX.Y.Z ...):
# builds the Python package, checks its version against the tag and uploads it to PyPI
# (dtree-encoding), using Trusted Publishing. From 1.9.0 on, dtree-encoding only forwards to
# triordinal-dtree; DTree.Encoding on NuGet is no longer updated (deprecated in favor of
# Triordinal.DTree), and DTree itself is developed in EnisOlgac/Triordinal.

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # PyPI Trusted Publishing, no token stored
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        working-directory: python
        run: |
          python -m pip install "triordinal-dtree>=2.0.0"
          python -m unittest discover -s tests
      - name: Check version
        working-directory: python
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${{ github.event.release.tag_name }}" || { echo "pyproject version $v does not match tag ${{ github.event.release.tag_name }}"; exit 1; }
      - name: Build
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
