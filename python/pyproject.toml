[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dtree-projections"
version = "1.4.1"
description = "Single-rooted directed tree encoded by two linear projections (Q1, Q2) with O(1) reachability"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Enis Olgac", email = "enis@digraphs.info" }]
keywords = ["directed tree", "reachability", "dual projection", "graph theory"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/EnisOlgac/DTree"

[tool.setuptools]
packages = ["dtree"]
